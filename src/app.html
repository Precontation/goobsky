<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1 viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<script>
			// Load all the custom data from localStorage
			// There's some custom logic with color schemes
			const storedTheme = localStorage.getItem('theme') ?? 'dark'; // Dark mode by default because thats what... twitter... does (i hate that platform!)
			const theme =
				storedTheme === 'system'
					? window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light'
					: storedTheme;

			document.documentElement.dataset.theme = theme;

			// Load the rest
			document.documentElement.dataset.roundness = localStorage.getItem('roundness') ?? 'square';
			document.documentElement.dataset.postPadding =
				localStorage.getItem('postPadding') ?? 'normal';
			document.documentElement.dataset.font = localStorage.getItem('font') ?? 'theme';
			document.documentElement.dataset.fontSize = localStorage.getItem('fontSize') ?? 'normal';
		</script>
		<link
			rel="preload"
			href="/fonts/Satoshi/Satoshi-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
